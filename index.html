<h2>📱 QR & 텍스트 일치 검사</h2>


<!-- =========================

<div id="cameraBox">

</div>

    </span>

      id="textValue"
      class="value">
      대기 중
    </div>

  </div>


  <div class="row">

    <span class="label">
      비교 결과
    </span>

    <div
      id="compareValue"

    </div>

<script>


/* ==================================================
   변수
================================================== */


const video =
  document.getElementById("video");


const canvas =
  document.getElementById("canvas");


const ctx =
  canvas.getContext(
    "2d",
    {
      willReadFrequently: true
    }
  );


const status =
  document.getElementById("status");


const result =
  document.getElementById("result");


const qrValue =
  document.getElementById("qrValue");


const textValue =
  document.getElementById("textValue");


const compareValue =
  document.getElementById("compareValue");


const ocrStatus =
  document.getElementById("ocrStatus");


const count =
  document.getElementById("count");


const startButton =
  document.getElementById("startButton");


const nextButton =
  document.getElementById("nextButton");


let stream = null;

let worker = null;

let cameraStarted = false;

let ocrReady = false;

let scanning = false;

let processing = false;


/*
  한 번 검사 완료하면
  다시 자동 검사하지 않음
*/

let inspectionFinished = false;

let scanCount = 0;


/* ==================================================
   비교용 정규화
================================================== */


/*
  대소문자와 공백 차이는 무시합니다.

  예:

  MRK00735AA-L LEG260808008

  MRK00735AA-L  LEG260808008

  MRK00735AA-L
  LEG260808008

  → 같은 값으로 판단
*/

function normalize(text) {

  return String(text || "")

    .toUpperCase()

    .replace(/\s+/g, "")

    .trim();

}


/* ==================================================
   OCR 보정
================================================== */


/*
  OCR에서 흔히 발생하는 오류를 보정합니다.
*/

function correctOCR(text) {

  return String(text || "")

    .toUpperCase()

    .replace(/\r/g, "")

    .replace(/O/g, "0")

    .replace(/I/g, "1")

    .replace(/\|/g, "1");

}


/* ==================================================
   OCR에서 QR과 같은 전체 문자열 찾기
================================================== */


function findMatchingText(
  ocrText,
  qr
) {


  if (!ocrText || !qr) {

    return "";

  }


  const qrNormalized =
    normalize(qr);


  const corrected =
    correctOCR(ocrText);


  /*
    OCR 결과를 줄 단위로 가져옴
  */

  const lines =
    corrected
      .split("\n")
      .map(
        line =>
          line.trim()
      )
      .filter(
        line =>
          line.length > 0
      );


  /*
    OCR에 QR 전체가
    들어있는지 확인
  */

  for (
    const line of lines
  ) {


    const lineNormalized =
      normalize(line);


    if (
      lineNormalized ===
      qrNormalized
    ) {

      return line;

    }


    /*
      OCR에서 QR의 전체 내용이
      일부 문자열로 붙어서 인식되는 경우
    */

    if (
      lineNormalized.includes(
        qrNormalized
      )
    ) {

      return line;

    }

  }


  /*
    OCR 결과 전체를
    공백 제거하여 비교
  */

  const allOCR =
    normalize(corrected);


  if (
    allOCR.includes(
      qrNormalized
    )
  ) {

    return qr;

  }


  /*
    QR과 완전히 같은 문자열이
    없으면 OCR에서 가장 긴
    영문/숫자/하이픈 조합을 찾음
  */

  const candidates =
    corrected.match(
      /[A-Z0-9-]{5,}/g
    ) || [];


  /*
    두 개 이상의 OCR 조각이
    QR과 연결되는 경우를 확인
  */

  for (
    let i = 0;
    i < candidates.length;
    i++
  ) {


    let combined =
      candidates[i];


    for (
      let j = i + 1;
      j < candidates.length;
      j++
    ) {


      combined +=
        candidates[j];


      if (
        normalize(combined) ===
        qrNormalized
      ) {

        return combined;

      }

    }

  }


  /*
    일치하는 전체 문자열을
    찾지 못함
  */

  return "";

}


/* ==================================================
   QR과 제품 텍스트 정확 비교
================================================== */


function compareExact(
  qr,
  printedText
) {


  const qrClean =
    normalize(qr);


  const textClean =
    normalize(printedText);


  /*
    빈 값이면 FAIL
  */

  if (
    qrClean.length === 0 ||
    textClean.length === 0
  ) {

    return false;

  }


  /*
    전체 문자열 정확히 비교
  */

  return (
    qrClean ===
    textClean
  );

}


/* ==================================================
   PASS
================================================== */


function showPASS(
  qr,
  printedText
) {


  result.className =
    "pass";


  result.innerHTML =
    "PASS";


  result.style.display =
    "block";


  status.innerText =
    "✅ QR과 제품 인쇄 내용이 일치합니다.";


  qrValue.innerText =
    qr;


  textValue.innerText =
    printedText;


  compareValue.innerText =
    "✅ 일치";

}


/* ==================================================
   FAIL
================================================== */


function showFAIL(
  qr,
  printedText
) {


  result.className =
    "fail";


  result.innerHTML =
    "FAIL";


  result.style.display =
    "block";


  status.innerText =
    "❌ QR과 제품 인쇄 내용이 일치하지 않습니다.";


  qrValue.innerText =
    qr || "인식 실패";


  textValue.innerText =
    printedText || "인식 실패";


  compareValue.innerText =
    "❌ 불일치";

}


/* ==================================================
   자동초점
================================================== */


async function enableAutoFocus() {


  if (!stream) {

    return;

  }


  try {


    const tracks =
      stream.getVideoTracks();


    if (
      tracks.length === 0
    ) {

      return;

    }


    const track =
      tracks[0];


    if (
      !track.getCapabilities
    ) {

      return;

    }


    const capabilities =
      track.getCapabilities();


    /*
      연속 자동초점 지원 여부 확인
    */

    if (
      capabilities.focusMode &&
      capabilities.focusMode.includes(
        "continuous"
      )
    ) {


      await track.applyConstraints({

        advanced: [

          {
            focusMode:
              "continuous"
          }

        ]

      });


      document.getElementById(
        "focusText"
      ).innerText =
        "🔍 자동 초점 활성화";


    }

    else {


      document.getElementById(
        "focusText"
      ).innerText =
        "🔍 카메라 기본 자동초점 사용";

    }

  }

  catch(error) {

    console.log(
      "자동초점 설정 오류:",
      error
    );

  }

}


/* ==================================================
   카메라 시작
================================================== */


async function startCamera() {


  if (cameraStarted) {

    return;

  }


  try {


    status.innerText =
      "📷 카메라 권한 요청 중...";


    /*
      후면 카메라 우선
    */

    stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          audio: false,

          video: {

            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }

          }

        });


    video.srcObject =
      stream;


    video.muted =
      true;


    video.setAttribute(
      "playsinline",
      ""
    );


    video.setAttribute(
      "webkit-playsinline",
      ""
    );


    await video.play();


    cameraStarted =
      true;


    startButton.style.display =
      "none";


    status.innerText =
      "✅ 카메라 준비 완료";


    /*
      자동초점
    */

    await enableAutoFocus();


    /*
      영상 준비
    */

    await waitForVideo();


    /*
      자동 QR 검색 시작
    */

    startScanning();


  }

  catch(error) {


    console.error(
      error
    );


    cameraStarted =
      false;


    if (
      error.name ===
      "NotAllowedError"
    ) {

      status.innerText =
        "❌ 카메라 권한이 거부되었습니다. 브라우저 설정에서 카메라를 허용해주세요.";

    }

    else if (
      error.name ===
      "NotFoundError"
    ) {

      status.innerText =
        "❌ 카메라를 찾을 수 없습니다.";

    }

    else {

      status.innerText =
        "❌ 카메라 실행 실패: " +
        error.message;

    }

  }

}


/* ==================================================
   비디오 준비
================================================== */


function waitForVideo() {


  return new Promise(
    function(resolve) {


      if (
        video.readyState >= 2 &&
        video.videoWidth > 0
      ) {

        resolve();

        return;

      }


      video.onloadedmetadata =
        function() {

          resolve();

        };

    }
  );

}


/* ==================================================
   OCR 준비
================================================== */


async function initOCR() {


  try {


    ocrStatus.innerText =
      "OCR 엔진 준비 중...";


    worker =
      await Tesseract.createWorker(
        "eng"
      );


    ocrReady =
      true;


    ocrStatus.innerText =
      "✅ OCR 준비 완료";


  }

  catch(error) {


    console.error(error);


    ocrStatus.innerText =
      "❌ OCR 엔진 준비 실패";

  }

}


/* ==================================================
   QR 자동 검색
================================================== */


function startScanning() {


  if (scanning) {

    return;

  }


  scanning =
    true;


  requestAnimationFrame(
    scanLoop
  );

}


/* ==================================================
   스캔 루프
================================================== */


async function scanLoop() {


  /*
    검사 완료 후에는
    다시 검사하지 않음
  */

  if (
    !scanning ||
    inspectionFinished
  ) {

    return;

  }


  /*
    OCR 중이면 기다림
  */

  if (!processing) {

    await scanQR();

  }


  /*
    계속 반복해서 QR을 찾는 것은
    검사 전 단계에서만 실행
  */

  if (
    !inspectionFinished
  ) {


    setTimeout(
      function() {

        requestAnimationFrame(
          scanLoop
        );

      },
      100
    );

  }

}


/* ==================================================
   QR 검사
================================================== */


async function scanQR() {


  if (
    !cameraStarted ||
    video.videoWidth <= 0 ||
    video.videoHeight <= 0
  ) {

    return;

  }


  /*
    모바일 처리 속도 향상
  */

  const maxWidth =
    960;


  let width =
    video.videoWidth;


  let height =
    video.videoHeight;


  if (
    width > maxWidth
  ) {


    const ratio =
      maxWidth / width;


    width =
      maxWidth;


    height =
      Math.round(
        height * ratio
      );

  }


  canvas.width =
    width;


  canvas.height =
    height;


  ctx.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  const imageData =
    ctx.getImageData(
      0,
      0,
      width,
      height
    );


  let qr = "";


  /*
    QR 찾기
  */

  if (window.jsQR) {


    const code =
      jsQR(
        imageData.data,
        imageData.width,
        imageData.height,
        {
          inversionAttempts:
            "attemptBoth"
        }
      );


    if (code) {

      qr =
        code.data.trim();

    }

  }


  /*
    QR 없으면 계속 찾음
  */

  if (!qr) {


    status.innerText =
      "🔍 QR 코드 찾는 중...";


    return;

  }


  /*
    QR 발견
  */

  qrValue.innerText =
    qr;


  status.innerText =
    "✅ QR 인식 완료";


  /*
    OCR 준비 전이면 대기
  */

  if (!ocrReady) {


    status.innerText =
      "⏳ OCR 엔진 준비 중...";


    return;

  }


  /*
    QR이 발견된 순간
    OCR 실행
  */

  await runOCR(qr);

}


/* ==================================================
   OCR 검사
================================================== */


async function runOCR(qr) {


  if (processing) {

    return;

  }


  processing =
    true;


  try {


    scanCount++;


    count.innerText =
      "검사 횟수: " +
      scanCount;


    status.innerText =
      "🔎 제품에 인쇄된 전체 텍스트 확인 중...";


    ocrStatus.innerText =
      "🔎 OCR 문자 인식 중...";


    /*
      OCR
    */

    const ocrResult =
      await worker.recognize(
        canvas
      );


    const ocrText =
      ocrResult.data.text || "";


    console.log(
      "OCR 원문:",
      ocrText
    );


    /*
      QR과 같은 전체 문자열을 찾음
    */

    const printedText =
      findMatchingText(
        ocrText,
        qr
      );


    /*
      인식 결과 표시
    */

    textValue.innerText =
      printedText ||
      "인쇄 문자 인식 실패";


    /*
      전체 문자열이 인식되지 않으면
      FAIL 처리
    */

    if (!printedText) {


      showFAIL(
        qr,
        "인쇄 문자 인식 실패"
      );


      ocrStatus.innerText =
        "❌ 전체 문자열을 인식하지 못했습니다.";


      /*
        여기서 검사 종료
      */

      finishInspection();


      return;

    }


    /*
      QR과 제품 텍스트
      전체 문자열 정확 비교
    */

    const matched =
      compareExact(
        qr,
        printedText
      );


    /*
      PASS
    */

    if (matched) {


      showPASS(
        qr,
        printedText
      );


      ocrStatus.innerText =
        "✅ 검사 완료";


    }

    /*
      FAIL
    */

    else {


      showFAIL(
        qr,
        printedText
      );


      ocrStatus.innerText =
        "❌ 검사 완료";

    }


    /*
      검사 종료
    */

    finishInspection();


  }

  catch(error) {


    console.error(
      "OCR 오류:",
      error
    );


    showFAIL(
      qr,
      "OCR 오류"
    );


    finishInspection();

  }


  processing =
  false;

}


/* ==================================================
   검사 종료
================================================== */


function finishInspection() {


  /*
    중요:
    자동 반복검사를 완전히 중지
  */

  inspectionFinished =
    true;


  scanning =
    false;


  /*
    다음 검사 버튼 표시
