<body>


  <h2>📱 QR & 시리얼 자동 검사</h2>


  <!-- 카메라 -->

  <div id="cameraBox">

    <video
      id="video"
      autoplay
      muted
      playsinline
      webkit-playsinline>
    </video>


    <div id="guide">

      <div id="guideText">
        QR과 시리얼을 화면 안에 맞춰주세요
      </div>

    </div>


    <div id="scanLine"></div>

  </div>


  <canvas id="canvas"></canvas>


  <!-- 시작 버튼 -->

  <button
    id="startButton"
    onclick="startCamera()">

    📷 카메라 시작

  </button>


  <!-- 상태 -->

  <div id="status">

    카메라 시작 버튼을 눌러주세요.

  </div>


  <!-- OCR 상태 -->

  <div id="ocrStatus">

    OCR 엔진 준비 중...

  </div>


  <!-- PASS / FAIL -->

  <div id="result"></div>


  <!-- 인식 데이터 -->

  <div class="dataBox">

    <div class="row">

      <span class="label">
        QR
      </span>

      <span id="qrText">
        대기 중
      </span>

    </div>


    <div class="row">

      <span class="label">
        시리얼
      </span>

      <span id="serialText">
        대기 중
      </span>

    </div>


    <div class="row">

      <span class="label">
        OCR
      </span>

      <span id="ocrText">
        대기 중
      </span>

    </div>

  </div>


  <div id="count">

    검사 횟수: 0

  </div>


<script>


  /* ==================================================
     기본 변수
  ================================================== */


  const video =
    document.getElementById("video");


  const canvas =
    document.getElementById("canvas");


  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );


  const status =
    document.getElementById("status");


  const result =
    document.getElementById("result");


  const qrText =
    document.getElementById("qrText");


  const serialText =
    document.getElementById("serialText");


  const ocrText =
    document.getElementById("ocrText");


  const ocrStatus =
    document.getElementById("ocrStatus");


  const count =
    document.getElementById("count");


  const startButton =
    document.getElementById("startButton");


  let worker = null;


  let stream = null;


  let cameraStarted = false;


  let ocrReady = false;


  let scanning = false;


  let processing = false;


  let scanCount = 0;


  /*
    마지막 검사값

    같은 제품을 계속 비추고 있을 때
    계속 PASS를 다시 표시하지 않도록 사용
  */

  let lastQR = "";

  let lastSerial = "";

  let lastResult = "";


  /* ==================================================
     문자열 정리
  ================================================== */


  function normalize(text) {

    return String(text || "")

      .toUpperCase()

      .replace(
        /[^A-Z0-9]/g,
        ""
      );

  }


  /* ==================================================
     OCR 오인식 보정
  ================================================== */


  function correctOCR(text) {

    return String(text || "")

      .toUpperCase()

      /*
        흔한 OCR 오류
      */

      .replace(/O/g, "0")

      .replace(/I/g, "1")

      .replace(/L/g, "1")

      .replace(/\|/g, "1");

  }


  /* ==================================================
     시리얼 추출
  ================================================== */


  function extractSerial(
    text,
    qr
  ) {


    if (!text) {

      return "";

    }


    const corrected =
      correctOCR(text);


    const qrClean =
      normalize(qr);


    /*
      줄 단위 분리
    */

    const lines =
      corrected
        .split(/\n+/)
        .map(
          x => x.trim()
        )
        .filter(
          x => x.length > 0
        );


    let candidates = [];


    /*
      영문 + 숫자로 된 문자열 추출
    */

    lines.forEach(
      function(line) {

        const matches =
          line.match(
            /[A-Z0-9]{5,}/g
          );


        if (matches) {

          matches.forEach(
            function(value) {

              candidates.push(value);

            }
          );

        }

      }
    );


    /*
      QR 안에 들어있는
      시리얼을 우선 찾음
    */

    for (
      let candidate of candidates
    ) {

      if (
        qrClean &&
        (
          qrClean.includes(
            candidate
          ) ||

          candidate.includes(
            qrClean
          )
        )
      ) {

        return candidate;

      }

    }


    /*
      가장 긴 값을 반환
    */

    candidates.sort(
      function(a, b) {

        return b.length - a.length;

      }
    );


    if (
      candidates.length > 0
    ) {

      return candidates[0];

    }


    return "";

  }


  /* ==================================================
     QR / 시리얼 비교
  ================================================== */


  function compareValues(
    qr,
    serial
  ) {


    const q =
      normalize(qr);


    const s =
      normalize(serial);


    if (
      !q ||
      !s
    ) {

      return false;

    }


    /*
      QR 안에 시리얼이 있는 경우
    */

    if (
      q.includes(s)
    ) {

      return true;

    }


    /*
      OCR 값 안에 QR이 있는 경우
    */

    if (
      s.includes(q)
    ) {

      return true;

    }


    return false;

  }


  /* ==================================================
     PASS
  ================================================== */


  function showPASS(
    qr,
    serial
  ) {


    result.className =
      "pass";


    result.innerHTML =
      "PASS";


    status.innerText =
      "✅ 정상 - QR과 시리얼이 일치합니다.";


    qrText.innerText =
      qr;


    serialText.innerText =
      serial;

  }


  /* ==================================================
     FAIL
  ================================================== */


  function showFAIL(
    qr,
    serial,
    reason
  ) {


    result.className =
      "fail";


    result.innerHTML =
      "FAIL";


    status.innerText =
      "❌ 불량 - " + reason;


    qrText.innerText =
      qr || "인식 실패";


    serialText.innerText =
      serial || "인식 실패";

  }


  /* ==================================================
     카메라 시작
  ================================================== */


  async function startCamera() {


    /*
      이미 실행 중이면 종료
    */

    if (cameraStarted) {

      return;

    }


    try {


      status.innerText =
        "📷 카메라 권한 요청 중...";


      /*
        모바일 후면 카메라 우선

        exact 사용하지 않음
        → Android / iPhone 호환성 향상
      */

      const constraints = {

        audio: false,

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        }

      };


      stream =
        await navigator
          .mediaDevices
          .getUserMedia(
            constraints
          );


      video.srcObject =
        stream;


      video.setAttribute(
        "playsinline",
        ""
      );


      video.setAttribute(
        "webkit-playsinline",
        ""
      );


      video.muted = true;


      await video.play();


      cameraStarted =
        true;


      startButton.disabled =
        true;


      startButton.innerText =
        "📷 카메라 작동 중";


      status.innerText =
        "✅ 카메라 준비 완료";


      /*
        카메라가 실제로
        화면 크기를 가져올 때까지 대기
      */

      await waitForVideo();


      /*
        자동 스캔 시작
      */

      startScanning();


    }

    catch(error) {


      console.error(
        "카메라 오류:",
        error
      );


      cameraStarted =
        false;


      if (
        error.name ===
        "NotAllowedError"
      ) {

        status.innerText =
          "❌ 카메라 권한이 거부되었습니다. 브라우저에서 카메라를 허용해주세요.";

      }

      else if (
        error.name ===
        "NotFoundError"
      ) {

        status.innerText =
          "❌ 카메라를 찾을 수 없습니다.";

      }

      else if (
        error.name ===
        "NotReadableError"
      ) {

        status.innerText =
          "❌ 다른 앱이 카메라를 사용 중입니다.";

      }

      else if (
        error.name ===
        "SecurityError"
      ) {

        status.innerText =
          "❌ 보안 오류입니다. HTTPS 주소에서 실행해주세요.";

      }

      else {

        status.innerText =
          "❌ 카메라 실행 실패: " +
          error.message;

      }

    }

  }


  /* ==================================================
     비디오 준비 대기
  ================================================== */


  function waitForVideo() {


    return new Promise(
      function(resolve) {


        if (
          video.readyState >= 2 &&
          video.videoWidth > 0
        ) {

          resolve();

          return;

        }


        video.onloadedmetadata =
          function() {

            resolve();

          };


      }
    );

  }


  /* ==================================================
     OCR 엔진 준비
  ================================================== */


  async function initOCR() {


    try {


      ocrStatus.innerText =
        "OCR 엔진 준비 중...";


      worker =
        await Tesseract.createWorker(
          "eng"
        );


      ocrReady =
        true;


      ocrStatus.innerText =
        "✅ OCR 준비 완료";


    }

    catch(error) {


      console.error(error);


      ocrStatus.innerText =
        "❌ OCR 엔진을 준비하지 못했습니다.";

    }

  }


  /* ==================================================
     자동 스캔 시작
  ================================================== */


  function startScanning() {


    if (scanning) {

      return;

    }


    scanning =
      true;


    /*
      QR 검색을 빠르게 반복
    */

    requestAnimationFrame(
      scanLoop
    );

  }


  /* ==================================================
     QR 먼저 검사
  ================================================== */


  async function scanLoop() {


    if (!scanning) {

      return;

    }


    /*
      OCR 처리 중이면
      잠시 기다림
    */

    if (!processing) {

      await scanQR();

    }


    /*
      약 100ms 간격으로
      QR 검색

      QR은 매우 빠르게 검사
    */

    setTimeout(
      function() {

        requestAnimationFrame(
          scanLoop
        );

      },
      100
    );

  }


  /* ==================================================
     QR 검사
  ================================================== */


  async function scanQR() {


    if (
      !cameraStarted ||
      video.videoWidth <= 0
    ) {

      return;

    }


    /*
      너무 큰 이미지는
      모바일에서 처리 속도가 느려지므로
      최대 약 960px 정도로 축소
    */

    const maxWidth = 960;


    let width =
      video.videoWidth;


    let height =
      video.videoHeight;


    if (
      width > maxWidth
    ) {

      const ratio =
        maxWidth / width;


      width =
        maxWidth;


      height =
        Math.round(
          height * ratio
        );

    }


    canvas.width =
      width;


    canvas.height =
      height;


    ctx.drawImage(
      video,
      0,
      0,
      width,
      height
    );


    const imageData =
      ctx.getImageData(
        0,
        0,
        width,
        height
      );


    let qr = "";


    /*
      QR 인식
    */

    if (window.jsQR) {


      const code =
        jsQR(
          imageData.data,
          imageData.width,
          imageData.height,
          {
            inversionAttempts:
              "attemptBoth"
          }
        );


      if (code) {

        qr =
          code.data.trim();

      }

    }


    /*
      QR이 없으면
      OCR을 실행하지 않음
    */

    if (!qr) {

      status.innerText =
        "🔍 QR 찾는 중...";


      return;

    }


    /*
      QR 발견
    */

    qrText.innerText =
      qr;


    status.innerText =
      "✅ QR 인식 완료 - 시리얼 확인 중...";


    /*
      같은 QR을 계속 처리하지 않음
    */

    const cleanQR =
      normalize(qr);


    if (
      cleanQR === lastQR &&
      lastResult === "PASS"
    ) {

      return;

    }


    /*
      QR이 잡혔을 때만 OCR 실행
    */

    if (!ocrReady) {

      status.innerText =
        "⏳ OCR 엔진 준비 중...";

      return;

    }


    await runOCR(qr);

  }


  /* ==================================================
     OCR 실행
  ================================================== */


  async function runOCR(qr) {


    if (processing) {

      return;

    }


    processing =
      true;


    try {


      scanCount++;


      count.innerText =
        "검사 횟수: " +
        scanCount;


      ocrStatus.innerText =
        "🔎 시리얼 문자 인식 중...";


      status.innerText =
        "🔎 시리얼 검사 중...";


      /*
        현재 화면 캡처
      */

      const ocrResult =
        await worker.recognize(
          canvas
        );


      const text =
        ocrResult.data.text || "";


      ocrText.innerText =
        text || "문자 인식 실패";


      /*
        시리얼 추출
      */

      const serial =
        extractSerial(
          text,
          qr
        );


      serialText.innerText =
        serial || "인식 실패";


      /*
        시리얼이 없으면
        잠시 후 다시 시도
      */

      if (!serial) {


        result.style.display =
          "none";


        status.innerText =
          "🔎 시리얼을 찾는 중...";


        ocrStatus.innerText =
          "QR은 인식됨 / 시리얼 재검색";


        /*
          다음 제품을 위한
          마지막 결과 초기화
        */

        lastResult = "";


        processing =
          false;


        return;

      }


      /*
        QR / 시리얼 비교
      */

      const matched =
        compareValues(
          qr,
          serial
        );


      /*
        결과 표시
      */

      if (matched) {


        lastQR =
          normalize(qr);


        lastSerial =
          normalize(serial);


        lastResult =
          "PASS";


        showPASS(
          qr,
          serial
        );


        ocrStatus.innerText =
          "✅ 검사 완료";


      }

      else {


        lastQR =
          normalize(qr);


        lastSerial =
          normalize(serial);


        lastResult =
          "FAIL";


        showFAIL(
          qr,
          serial,
          "QR과 시리얼 번호가 다릅니다."
        );


        ocrStatus.innerText =
          "❌ 검사 완료";

      }


      /*
        2초 후 결과 초기화

        다음 제품을 비추면
        자동으로 다시 검사
      */

      setTimeout(
        function() {

          resetForNextProduct();

        },
        2000
      );


    }

    catch(error) {


      console.error(
        "OCR 오류:",
        error
      );


      status.innerText =
        "OCR 검사 중 오류가 발생했습니다.";

    }


    processing =
      false;

  }


  /* ==================================================
     다음 제품 검사 준비
  ================================================== */


  function resetForNextProduct() {


    lastQR = "";

    lastSerial = "";

    lastResult = "";


    result.style.display =
      "none";


    qrText.innerText =
      "대기 중";


    serialText.innerText =
      "대기 중";


    ocrText.innerText =
      "대기 중";


    status.innerText =
      "🔍 다음 제품을 비춰주세요.";


    ocrStatus.innerText =
      "자동 검사 대기 중";

  }


  /* ==================================================
     페이지 시작
  ================================================== */


  window.addEventListener(
    "DOMContentLoaded",
    function() {


      /*
        OCR은 미리 준비

        카메라는 사용자가
        버튼을 눌러 시작
      */

      initOCR();

    }
  );


</script>

</body>

</html>
```
