<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QR & 시리얼 자동 검증</title>

  <!-- QR 인식 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>

  <!-- OCR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;

      max-width: 550px;
      margin: 0 auto;
      padding: 15px;
      text-align: center;
      background: #f5f6f8;
    }

    h2 {
      margin-bottom: 15px;
    }

    /* 카메라 */
    #video-container {
      position: relative;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      min-height: 280px;
    }

    video {
      width: 100%;
      display: block;
    }

    canvas {
      display: none;
    }

    /* 스캔 영역 */
    #scan-guide {
      position: absolute;
      left: 10%;
      top: 25%;
      width: 80%;
      height: 50%;
      border: 3px solid #00ff00;
      border-radius: 10px;
      pointer-events: none;
    }

    #scan-guide::before {
      content: "QR + 시리얼을 이 영역에 맞춰주세요";
      position: absolute;
      top: -30px;
      left: 0;
      width: 100%;
      color: white;
      font-size: 13px;
      text-shadow: 0 1px 3px #000;
    }

    /* 상태 */
    .status-badge {
      margin: 15px 0;
      padding: 12px;
      border-radius: 8px;
      background: #e9ecef;
      font-weight: bold;
      font-size: 14px;
    }

    /* 자동 스캔 */
    .auto-scan {
      margin-top: 12px;
      padding: 10px;
      background: #e7f1ff;
      color: #0056b3;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
    }

    /* 인식 데이터 */
    .data-box {
      margin-top: 12px;
      background: white;
      border-radius: 10px;
      padding: 12px;
      text-align: left;
    }

    .data-row {
      padding: 9px 0;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    .data-row:last-child {
      border-bottom: none;
    }

    .label {
      font-weight: bold;
      display: inline-block;
      width: 80px;
    }

    /* PASS / FAIL */
    #passFail {
      display: none;
      margin-top: 12px;
      padding: 20px;
      border-radius: 12px;
      font-size: 42px;
      font-weight: 900;
    }

    #passFail.pass {
      display: block;
      background: #28a745;
      color: white;
    }

    #passFail.fail {
      display: block;
      background: #dc3545;
      color: white;
    }

    /* 상세 결과 */
    .result-box {
      padding: 18px;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
      margin-top: 12px;
    }

    .match {
      background-color: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .mismatch {
      background-color: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .details {
      font-size: 13px;
      color: #555;
      margin-top: 10px;
      text-align: left;
      line-height: 1.6;
      word-break: break-all;
      background: rgba(255,255,255,0.6);
      padding: 10px;
      border-radius: 6px;
    }

    #scanCount {
      margin-top: 8px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>

<body>

  <h2>📱 QR & 시리얼 자동 검증</h2>

  <!-- 카메라 -->
  <div id="video-container">

    <video
      id="video"
      playsinline
      muted
      autoplay>
    </video>

    <div id="scan-guide"></div>

  </div>

  <canvas id="canvas"></canvas>

  <!-- 상태 -->
  <div id="status" class="status-badge">
    문자 인식 엔진 로딩 중...
  </div>

  <!-- 자동 검사 -->
  <div class="auto-scan">
    🔄 자동 스캔 작동 중
    <br>
    QR과 시리얼을 화면에 비추면 자동으로 검사합니다.
  </div>

  <div id="scanCount">
    검사 횟수: 0
  </div>

  <!-- 인식값 -->
  <div class="data-box">

    <div class="data-row">
      <span class="label">QR:</span>
      <span id="qrValue">대기 중...</span>
    </div>

    <div class="data-row">
      <span class="label">시리얼:</span>
      <span id="serialValue">대기 중...</span>
    </div>

  </div>

  <!-- PASS / FAIL -->
  <div id="passFail"></div>

  <!-- 상세 결과 -->
  <div
    id="resultBox"
    class="result-box"
    style="display:none;">
  </div>


<script>

  const video =
    document.getElementById("video");

  const canvas =
    document.getElementById("canvas");

  const ctx =
    canvas.getContext("2d");

  const statusEl =
    document.getElementById("status");

  const resultBox =
    document.getElementById("resultBox");

  const qrValue =
    document.getElementById("qrValue");

  const serialValue =
    document.getElementById("serialValue");

  const passFail =
    document.getElementById("passFail");

  const scanCountEl =
    document.getElementById("scanCount");


  let worker = null;

  let cameraReady = false;

  let scanning = false;

  let scanCount = 0;

  let isProcessing = false;


  /*
  =====================================================
  문자열 정리
  =====================================================
  */

  function normalize(text) {

    return String(text || "")
      .toUpperCase()
      .replace(/[^A-Z0-9]/g, "");

  }


  /*
  =====================================================
  OCR 오인식 보정
  =====================================================
  */

  function correctOCR(text) {

    return String(text || "")
      .toUpperCase()
      .replace(/O/g, "0")
      .replace(/I/g, "1")
      .replace(/L/g, "1");

  }


  /*
  =====================================================
  시리얼 추출
  =====================================================
  */

  function extractSerial(text, qrText) {

    if (!text) {
      return "";
    }


    const corrected =
      correctOCR(text);


    const lines =
      corrected
        .split(/\n+/)
        .map(x => x.trim())
        .filter(x => x.length > 0);


    const qrClean =
      normalize(qrText);


    let candidates = [];


    lines.forEach(function(line) {

      const tokens =
        line.match(/[A-Z0-9]{5,}/g);


      if (tokens) {

        tokens.forEach(function(token) {

          candidates.push(token);

        });

      }

    });


    /*
    QR 안에 포함된 값을 우선 찾음
    */

    for (let candidate of candidates) {

      if (
        qrClean &&
        (
          qrClean.includes(candidate) ||
          candidate.includes(qrClean)
        )
      ) {

        return candidate;

      }

    }


    /*
    가장 긴 문자열을 시리얼로 선택
    */

    candidates.sort(function(a, b) {

      return b.length - a.length;

    });


    return candidates.length > 0
      ? candidates[0]
      : "";

  }


  /*
  =====================================================
  QR ↔ 시리얼 비교
  =====================================================
  */

  function compareQRSerial(qr, serial) {

    if (!qr || !serial) {

      return false;

    }


    const cleanQR =
      normalize(qr);

    const cleanSerial =
      normalize(serial);


    if (!cleanQR || !cleanSerial) {

      return false;

    }


    /*
    시리얼이 QR 안에 있는 경우
    */

    if (cleanQR.includes(cleanSerial)) {

      return true;

    }


    /*
    QR이 OCR 결과 안에 있는 경우
    */

    if (cleanSerial.includes(cleanQR)) {

      return true;

    }


    return false;

  }


  /*
  =====================================================
  PASS 표시
  =====================================================
  */

  function showPASS(qr, serial) {

    passFail.className = "pass";

    passFail.innerHTML = "PASS";

    resultBox.className =
      "result-box match";

    resultBox.style.display =
      "block";


    resultBox.innerHTML = `
      ✅ QR / 시리얼 일치
      <div class="details">
        <b>인식된 QR:</b> ${qr}<br>
        <b>인식된 시리얼:</b> ${serial}
      </div>
    `;


    statusEl.innerText =
      "✅ 검사 완료 : 정상";

  }


  /*
  =====================================================
  FAIL 표시
  =====================================================
  */

  function showFAIL(qr, serial, reason) {

    passFail.className = "fail";

    passFail.innerHTML = "FAIL";

    resultBox.className =
      "result-box mismatch";

    resultBox.style.display =
      "block";


    resultBox.innerHTML = `
      ❌ QR / 시리얼 불일치
      <div class="details">
        <b>인식된 QR:</b> ${qr || "인식 실패"}<br>
        <b>인식된 시리얼:</b> ${serial || "인식 실패"}<br>
        <b>원인:</b> ${reason}
      </div>
    `;


    statusEl.innerText =
      "❌ 검사 결과 : FAIL";

  }


  /*
  =====================================================
  카메라 시작
  =====================================================
  */

  async function startCamera() {

    try {

      let stream;


      /*
      후면 카메라 우선
      */

      try {

        stream =
          await navigator.mediaDevices
            .getUserMedia({

              video: {
                facingMode: {
                  exact: "environment"
                }
              },

              audio: false

            });

      }

      catch(e) {

        stream =
          await navigator.mediaDevices
            .getUserMedia({

              video: {
                facingMode: "environment"
              },

              audio: false

            });

      }


      video.srcObject = stream;

      await video.play();


      cameraReady = true;


      statusEl.innerText =
        "카메라 준비 완료";

    }

    catch(error) {

      console.error(error);

      statusEl.innerText =
        "❌ 카메라를 사용할 수 없습니다. 카메라 권한을 확인해주세요.";

    }

  }


  /*
  =====================================================
  OCR 엔진 시작
  =====================================================
  */

  async function initOCR() {

    try {

      statusEl.innerText =
        "문자 인식 엔진 준비 중...";


      worker =
        await Tesseract.createWorker("eng");


      statusEl.innerText =
        "✅ 준비 완료 - 자동 스캔 중";


      startAutoScan();

    }

    catch(error) {

      console.error(error);

      statusEl.innerText =
        "❌ 문자 인식 엔진 로딩 실패";

    }

  }


  /*
  =====================================================
  자동 반복 스캔
  =====================================================
  */

  function startAutoScan() {

    if (scanning) {
      return;
    }


    scanning = true;


    autoScanLoop();

  }


  async function autoScanLoop() {

    if (!scanning) {
      return;
    }


    if (
      cameraReady &&
      worker &&
      video.videoWidth > 0 &&
      video.videoHeight > 0
    ) {

      await scanFrame();

    }


    /*
    약 1.5초마다 자동 검사
    */

    setTimeout(function() {

      autoScanLoop();

    }, 1500);

  }


  /*
  =====================================================
  실제 검사
  =====================================================
  */

  async function scanFrame() {

    /*
    OCR 중복 실행 방지
    */

    if (isProcessing) {
      return;
    }


    isProcessing = true;


    try {

      scanCount++;


      scanCountEl.innerText =
        "검사 횟수: " + scanCount;


      /*
      카메라 화면 캡처
      */

      canvas.width =
        video.videoWidth || 1280;

      canvas.height =
        video.videoHeight || 720;


      ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );


      /*
      ================================================
      QR 인식
      ================================================
      */

      const imageData =
        ctx.getImageData(
          0,
          0,
          canvas.width,
          canvas.height
        );


      let qrText = "";


      if (window.jsQR) {

        const qrCode =
          jsQR(
            imageData.data,
            imageData.width,
            imageData.height,
            {
              inversionAttempts:
                "attemptBoth"
            }
          );


        if (qrCode) {

          qrText =
            qrCode.data.trim();

        }

      }


      /*
      ================================================
      OCR
      ================================================
      */

      const ocrResult =
        await worker.recognize(canvas);


      const detectedText =
        ocrResult.data.text || "";


      /*
      ================================================
      시리얼 추출
      ================================================
      */

      const serial =
        extractSerial(
          detectedText,
          qrText
        );


      /*
      화면에 인식값 표시
      */

      qrValue.innerText =
        qrText || "인식 안됨";

      serialValue.innerText =
        serial || "인식 안됨";


      /*
      ================================================
      아직 둘 다 인식되지 않은 경우
      ================================================
      */

      if (!qrText && !serial) {

        statusEl.innerText =
          "QR + 시리얼을 카메라에 맞춰주세요.";

        isProcessing = false;

        return;

      }


      /*
      QR만 인식된 경우
      */

      if (!qrText) {

        statusEl.innerText =
          "QR 인식 중...";

        isProcessing = false;

        return;

      }


      /*
      시리얼만 인식된 경우
      */

      if (!serial) {

        statusEl.innerText =
          "시리얼 인식 중...";

        isProcessing = false;

        return;

      }


      /*
      ================================================
      QR과 시리얼 비교
      ================================================
      */

      const isMatch =
        compareQRSerial(
          qrText,
          serial
        );


      /*
      ================================================
      최종 결과
      ================================================
      */

      if (isMatch) {

        showPASS(
          qrText,
          serial
        );

      }

      else {

        showFAIL(
          qrText,
          serial,
          "QR 코드와 제품에 인쇄된 시리얼 번호가 다릅니다."
        );

      }

    }

    catch(error) {

      console.error(error);

      statusEl.innerText =
        "검사 중 오류가 발생했습니다.";

    }


    isProcessing = false;

  }


  /*
  =====================================================
  페이지 시작
  =====================================================
  */

  window.addEventListener(
    "DOMContentLoaded",
    function() {

      startCamera();

      initOCR();

    }
  );

</script>

</body>
</html>
