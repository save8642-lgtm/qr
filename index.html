<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>


<style>

  box-sizing: border-box;
}

body {

  margin: 0;
  padding: 12px;

  background: #f2f3f5;

  font-family:
    -apple-system,

<body>


<h2>📱 QR & 텍스트 일치 검사</h2>


<!-- ================================
     카메라
================================ -->

<div id="cameraBox">


  <video
    id="video"
    autoplay
    muted
    playsinline
    webkit-playsinline>
  </video>


  <div id="guide">

    <div id="guideText">

      QR과 인쇄된 문자를 화면 안에 맞춰주세요

    </div>

  </div>


  <div id="focusText">

    🔍 자동 초점 준비

  </div>


</div>


<canvas id="canvas"></canvas>


<!-- 카메라 시작 -->

<button
  id="startButton"
  onclick="startCamera()">

  📷 카메라 시작

</button>


<!-- 검사 버튼 -->

<button
  id="scanButton"
  onclick="scanOnce()"
  disabled>

  🔎 검사하기

</button>


<!-- 다음 검사 -->

<button
  id="nextButton"
  onclick="nextInspection()"
  disabled>

  🔄 다음 검사

</button>


<!-- 상태 -->

<div id="status">

  카메라 시작 버튼을 눌러주세요.

</div>


<!-- OCR 상태 -->

<div id="ocrStatus">

  OCR 엔진 준비 중...

</div>


<!-- 결과 -->

<div id="result"></div>


<!-- 인식 결과 -->

<div class="dataBox">


  <div class="row">

    <span class="label">
      QR 내용
    </span>

    <span id="qrValue">
      대기 중
    </span>

  </div>


  <div class="row">

    <span class="label">
      인쇄 문자
    </span>

    <span id="textValue">
      대기 중
    </span>

  </div>


  <div class="row">

    <span class="label">
      비교
    </span>

    <span id="compareValue">
      대기 중
    </span>

  </div>


</div>



<script>


/* ==================================================
   변수
================================================== */


const video =
  document.getElementById("video");


const canvas =
  document.getElementById("canvas");


const ctx =
  canvas.getContext(
    "2d",
    {
      willReadFrequently: true
    }
  );


const status =
  document.getElementById("status");


const result =
  document.getElementById("result");


const qrValue =
  document.getElementById("qrValue");


const textValue =
  document.getElementById("textValue");


const compareValue =
  document.getElementById("compareValue");


const ocrStatus =
  document.getElementById("ocrStatus");


const focusText =
  document.getElementById("focusText");


const startButton =
  document.getElementById("startButton");


const scanButton =
  document.getElementById("scanButton");


const nextButton =
  document.getElementById("nextButton");


let stream = null;

let cameraStarted = false;

let processing = false;

let ocrReady = false;

let worker = null;

let inspectionFinished = false;


/* ==================================================
   OCR 초기화
================================================== */


async function initOCR() {

  try {

    ocrStatus.innerText =
      "OCR 엔진 준비 중...";


    worker =
      await Tesseract.createWorker(
        "eng"
      );


    ocrReady = true;


    ocrStatus.innerText =
      "✅ OCR 엔진 준비 완료";


  }

  catch(error) {

    console.error(error);

    ocrStatus.innerText =
      "❌ OCR 엔진 준비 실패";

  }

}


/* ==================================================
   문자열 정리
================================================== */


/*
  비교할 때

  대문자/소문자 차이
  공백
  줄바꿈

  때문에 오판하지 않도록 정리합니다.

  하이픈(-)은 유지합니다.
*/


function normalize(text) {

  return String(text || "")

    .toUpperCase()

    .replace(
      /[\r\n]+/g,
      " "
    )

    .replace(
      /\s+/g,
      " "
    )

    .trim();

}


/* ==================================================
   OCR 문자 보정
================================================== */


function correctOCR(text) {

  return String(text || "")

    .toUpperCase()

    /*
      OCR에서 자주 생기는
      문자 오류를 일부 보정
    */

    .replace(/\|/g, "I")

    .replace(/[“”"]/g, "")

    .replace(/[‘’']/g, "");

}


/* ==================================================
   QR과 동일한 문자열 찾기
================================================== */


function findMatchingText(
  ocrText,
  qrText
) {


  const qr =
    normalize(qrText);


  const corrected =
    correctOCR(ocrText);


  /*
    OCR 전체 문장을
    한 줄로 변환
  */

  const ocr =
    normalize(corrected);


  /*
    1. 전체 OCR과 정확히 같은 경우
  */

  if (
    ocr === qr
  ) {

    return qr;

  }


  /*
    2. OCR 문장 안에
       QR 문자열이 들어있는 경우
  */

  if (
    ocr.includes(qr)
  ) {

    return qr;

  }


  /*
    3. OCR 줄 단위 검색
  */

  const lines =
    corrected
      .split(/\r?\n/)
      .map(
        line =>
          normalize(line)
      )
      .filter(
        line =>
          line.length > 0
      );


  for (
    const line of lines
  ) {

    if (
      line === qr
    ) {

      return line;

    }

  }


  return "";

}


/* ==================================================
   카메라 시작
================================================== */


async function startCamera() {


  if (cameraStarted) {

    return;

  }


  try {


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      status.innerText =
        "❌ 이 브라우저에서는 카메라를 사용할 수 없습니다.";

      return;

    }


    status.innerText =
      "📷 카메라 권한 요청 중...";


    /*
      후면 카메라 우선
    */

    const constraints = {

      audio: false,

      video: {

        facingMode: {
          ideal: "environment"
        },

        width: {
          ideal: 1280
        },

        height: {
          ideal: 720
        }

      }

    };


    stream =
      await navigator
        .mediaDevices
        .getUserMedia(
          constraints
        );


    video.srcObject =
      stream;


    video.muted =
      true;


    video.setAttribute(
      "playsinline",
      ""
    );


    video.setAttribute(
      "webkit-playsinline",
      ""
    );


    await video.play();


    cameraStarted =
      true;


    startButton.disabled =
      true;


    startButton.innerText =
      "📷 카메라 작동 중";


    scanButton.disabled =
      false;


    status.innerText =
      "✅ 카메라 준비 완료. 제품을 맞춰주세요.";


    /*
      자동초점
    */

    await enableAutoFocus();


  }

  catch(error) {


    console.error(
      error
    );


    cameraStarted =
      false;


    if (
      error.name ===
      "NotAllowedError"
    ) {

      status.innerText =
        "❌ 카메라 권한이 거부되었습니다. 브라우저 설정에서 카메라를 허용해주세요.";

    }

    else if (
      error.name ===
      "NotFoundError"
    ) {

      status.innerText =
        "❌ 카메라를 찾을 수 없습니다.";

    }

    else {

      status.innerText =
        "❌ 카메라 실행 실패: " +
        error.message;

    }

  }

}


/* ==================================================
   자동초점
================================================== */


async function enableAutoFocus() {


  try {


    if (!stream) {

      return;

    }


    const track =
      stream.getVideoTracks()[0];


    if (!track) {

      return;

    }


    /*
      카메라가 지원하는 기능 확인
    */

    const capabilities =
      track.getCapabilities
        ? track.getCapabilities()
        : {};


    /*
      Continuous autofocus 지원
    */

    if (
      capabilities.focusMode &&
      capabilities.focusMode.includes(
        "continuous"
      )
    ) {


      await track.applyConstraints({

        advanced: [

          {
            focusMode:
              "continuous"
          }

        ]

      });


      focusText.innerText =
        "🔍 자동 초점 활성화";


    }

    else {

      focusText.innerText =
        "🔍 카메라 자동 초점 사용";

    }

  }

  catch(error) {

    console.log(
      "자동초점 설정:",
      error
    );

    focusText.innerText =
      "🔍 카메라 기본 자동 초점";

  }

}


/* ==================================================
   한 번만 검사
================================================== */


async function scanOnce() {


  /*
    이미 검사 완료면
    다시 검사하지 않음
  */

  if (
    inspectionFinished
  ) {

    return;

  }


  if (
    !cameraStarted
  ) {

    alert(
      "먼저 카메라를 시작해주세요."
    );

    return;

  }


  if (
    processing
  ) {

    return;

  }


  if (
    !ocrReady
  ) {

    status.innerText =
      "⏳ OCR 엔진 준비 중입니다.";

    return;

  }


  processing =
    true;


  scanButton.disabled =
    true;


  nextButton.disabled =
    true;


  result.style.display =
    "none";


  status.innerText =
    "🔎 QR 코드 인식 중...";


  try {


    /*
      카메라 프레임 캡처
    */

    const width =
      video.videoWidth;


    const height =
      video.videoHeight;


    if (
      width <= 0 ||
      height <= 0
    ) {

      throw new Error(
        "카메라 영상이 준비되지 않았습니다."
      );

    }


    /*
      모바일 처리 속도를 위해
      최대 1280px
    */

    const maxWidth =
      1280;


    let drawWidth =
      width;


    let drawHeight =
      height;


    if (
      drawWidth > maxWidth
    ) {

      const ratio =
        maxWidth /
        drawWidth;


      drawWidth =
        maxWidth;


      drawHeight =
        Math.round(
          drawHeight *
          ratio
        );

    }


    canvas.width =
      drawWidth;


    canvas.height =
      drawHeight;


    ctx.drawImage(

      video,

      0,
      0,

      drawWidth,
      drawHeight

    );


    /*
      QR 인식
    */

    const imageData =
      ctx.getImageData(
        0,
        0,
        drawWidth,
        drawHeight
      );


    let qrText = "";


    if (
      window.jsQR
    ) {


      const code =
        jsQR(

          imageData.data,

          imageData.width,

          imageData.height,

          {
            inversionAttempts:
              "attemptBoth"
          }

        );


      if (code) {

        qrText =
          code.data.trim();

      }

    }


    /*
      QR 실패
    */

    if (!qrText) {


      result.className =
        "fail";


      result.innerHTML =
        "FAIL";


      result.style.display =
        "block";


      status.innerText =
        "❌ QR 코드를 인식하지 못했습니다.";


      compareValue.innerText =
        "❌ QR 인식 실패";


      nextButton.disabled =
        false;


      inspectionFinished =
        true;


      return;

    }


    qrValue.innerText =
      qrText;


    status.innerText =
      "✅ QR 인식 완료 → 제품 문자 확인 중...";


    /*
      OCR 실행
    */

    const ocrResult =
      await worker.recognize(
        canvas
      );


    const detectedText =
      ocrResult.data.text || "";


    console.log(
      "OCR 결과:",
      detectedText
    );


    /*
      QR과 같은 문자열이
      OCR에 있는지 확인
    */

    const matchedText =
      findMatchingText(
        detectedText,
        qrText
      );


    /*
      ============================
      PASS
      ============================
    */

    if (
      matchedText
    ) {


      textValue.innerText =
        matchedText;


      compareValue.innerText =
        "✅ 일치";


      result.className =
        "pass";


      result.innerHTML =
        "PASS";


      result.style.display =
        "block";


      status.innerText =
        "✅ QR과 제품 인쇄 문자가 일치합니다.";


      ocrStatus.innerText =
        "검사 완료";


    }


    /*
      ============================
      FAIL
      ============================
    */

    else {


      const displayOCR =
        normalize(
          correctOCR(
            detectedText
          )
        );


      textValue.innerText =
        displayOCR ||
        "문자 인식 실패";


      compareValue.innerText =
        "❌ 불일치";


      result.className =
        "fail";


      result.innerHTML =
        "FAIL";


      result.style.display =
        "block";


      status.innerText =
        "❌ QR과 제품 인쇄 문자가 일치하지 않습니다.";


      ocrStatus.innerText =
        "검사 완료";

    }


    /*
      검사 종료
    */

    inspectionFinished =
      true;


    /*
      다음 검사 버튼 활성화
    */

    nextButton.disabled =
      false;


  }

  catch(error) {


    console.error(
      "검사 오류:",
      error
    );


    result.className =
      "fail";


    result.innerHTML =
      "ERROR";


    result.style.display =
      "block";


    status.innerText =
      "❌ 검사 중 오류가 발생했습니다.";


    nextButton.disabled =
      false;


    inspectionFinished =
      true;

  }


  processing =
    false;

}


/* ==================================================
   다음 검사
================================================== */


function nextInspection() {


  /*
    결과 초기화
  */

  result.style.display =
    "none";


  qrValue.innerText =
    "대기 중";


  textValue.innerText =
    "대기 중";


  compareValue.innerText =
    "대기 중";


  ocrStatus.innerText =
    "다음 검사 대기";


  status.innerText =
    "📷 다음 제품을 카메라에 맞춰주세요.";


  /*
    다시 검사 가능
  */

  inspectionFinished =
    false;


  nextButton.disabled =
    true;


  scanButton.disabled =
    false;

}


/* ==================================================
   페이지 로딩
================================================== */


window.addEventListener(
  "DOMContentLoaded",
  function() {

    /*
      OCR은 미리 준비
    */

    initOCR();

  }
);


</script>

</body>

</html>
```
