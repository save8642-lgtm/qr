<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
  <title>실시간 QR ↔ OCR 비교</title>
  <style>
    body { margin:0; font-family:system-ui,Segoe UI,Roboto,'Noto Sans KR',sans-serif; background:#111; color:#eee; display:flex; flex-direction:column; height:100vh; }
    #container { position:relative; flex:1; display:flex; align-items:stretch; }
    video { width:100%; height:100%; object-fit:cover; transform: scaleX(-1); } /* mirror for user-friendly UI */
    canvas#overlay { position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; transform: scaleX(-1); }
    #panel { padding:12px; background:#0b0b0b; color:#fff; font-size:14px; }
    .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    .badge { padding:6px 10px; background:#222; border-radius:6px; font-family:monospace; }
    #status { margin-left:auto; color:#aaa; font-size:13px; }
    #result { margin-top:8px; white-space:pre-wrap; font-family:monospace; }
    button { padding:8px 10px; border-radius:6px; border:0; background:#1976d2; color:#fff; cursor:pointer; }
    button:disabled { opacity:0.5; }
    small.note { color:#999; display:block; margin-top:6px; }
  </style>

  <!-- jsQR (QR detection) -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <!-- Tesseract.js for OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@2.1.5/dist/tesseract.min.js"></script>
</head>
<body>
  <div id="container">
    <video id="video" autoplay playsinline></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="panel">
    <div class="row">
      <div class="badge">QR: <span id="qrText">[없음]</span></div>
      <div class="badge">OCR: <span id="ocrText">[없음]</span></div>
      <div class="badge">Match: <strong id="match">-</strong></div>
      <div id="status">초기화 중...</div>
      <button id="toggleMirror">미러 토글</button>
    </div>
    <div id="result"></div>
    <small class="note">사용법: 카메라 권한 허용 → QR과 텍스트를 같은 화면에 놓고 포인팅하세요. (HTTPS/localhost 필요)</small>
  </div>

  <script>
    // UI elements
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const overlayCtx = overlay.getContext('2d');
    const qrTextEl = document.getElementById('qrText');
    const ocrTextEl = document.getElementById('ocrText');
    const matchEl = document.getElementById('match');
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');
    const toggleMirrorBtn = document.getElementById('toggleMirror');

    let mirror = true;
    toggleMirrorBtn.addEventListener('click', () => {
      mirror = !mirror;
      video.style.transform = mirror ? 'scaleX(-1)' : 'scaleX(1)';
      overlay.style.transform = mirror ? 'scaleX(-1)' : 'scaleX(1)';
    });

    // Hidden canvas for processing frames
    const captureCanvas = document.createElement('canvas');
    const captureCtx = captureCanvas.getContext('2d');

    // Pipeline params
    const QR_POLL_MS = 200;    // QR detection 빈도
    const OCR_COOLDOWN_MS = 1200; // OCR 최소 간격
    const QR_EXPAND_RATIO = 1.6; // QR bounding box 주변 영역을 얼마나 확장해서 OCR할지
    let lastQRTime = 0;
    let lastOCRTime = 0;
    let lastQRText = '';
    let isOCRRunning = false;

    // Matching utils (normalize, confusable map, levenshtein)
    const CONFUSABLE_MAP = {
      '0':'O','O':'O','o':'O',
      '1':'I','l':'I','L':'I','I':'I',
      '5':'S','S':'S','s':'S',
      '2':'Z','Z':'Z','z':'Z',
      '8':'B','B':'B',
      '6':'G','9':'G','g':'G','G':'G'
    };

    function normalizeForMatch(s) {
      if (!s) return '';
      // Unicode normalizing is not available directly, but we uppercase and collapse whitespace
      let t = s.normalize ? s.normalize('NFKC') : s;
      t = t.toUpperCase();
      t = t.replace(/\s+/g, ' ').trim();
      // convert various dashes to hyphen
      t = t.replace(/[\u2010-\u2015]/g, '-');
      // map confusables and keep only letters/digits/hyphen
      let out = '';
      for (const ch of t) {
        if (ch === '-') { out += '-'; continue; }
        const mapped = CONFUSABLE_MAP[ch] || ch;
        if (/[A-Z0-9]/.test(mapped)) out += mapped;
        // else drop
      }
      out = out.replace(/-+/g, '-').replace(/^-|-$| /g, (m)=> m === ' ' ? '' : '');
      out = out.replace(/\s+/g, '');
      out = out.replace(/^-|-$| /g, ''); // final trim dashes/spaces
      return out;
    }

    function levenshtein(a, b) {
      if (!a) return b.length;
      if (!b) return a.length;
      const n = a.length, m = b.length;
      const dp = Array.from({length: n+1}, (_,i) => new Uint16Array(m+1).map((_,j)=>0));
      for (let i=0;i<=n;i++) dp[i][0]=i;
      for (let j=0;j<=m;j++) dp[0][j]=j;
      for (let i=1;i<=n;i++){
        for (let j=1;j<=m;j++){
          const cost = a[i-1] === b[j-1] ? 0 : 1;
          dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+cost);
        }
      }
      return dp[n][m];
    }

    function similarity(a,b) {
      if (a === b) return 1.0;
      const d = levenshtein(a,b);
      return 1.0 - d / Math.max(a.length, b.length);
    }

    function isMatchNormalized(qrRaw, ocrRaw) {
      const a = normalizeForMatch(qrRaw);
      const b = normalizeForMatch(ocrRaw);
      if (!a || !b) return {match:false, sim:0, normQR:a, normOCR:b};
      if (a === b) return {match:true, sim:1, normQR:a, normOCR:b};

      // Split by hyphen and compare parts if possible
      const aParts = a.split('-').filter(Boolean);
      const bParts = b.split('-').filter(Boolean);
      if (aParts.length && aParts.length === bParts.length) {
        let weightedSum = 0, weightTotal = 0;
        for (let i=0;i<aParts.length;i++){
          const pA = aParts[i], pB = bParts[i] || '';
          const w = pA.length;
          const sim = similarity(pA,pB);
          weightedSum += sim * w; weightTotal += w;
          // numeric strictness
          if (/^\d+$/.test(pA) && sim < 0.95) return {match:false, sim:sim, normQR:a, normOCR:b};
        }
        const avg = weightedSum/weightTotal;
        return {match: avg >= 0.85, sim: avg, normQR:a, normOCR:b};
      }

      const wholeSim = similarity(a,b);
      return {match: wholeSim >= 0.85, sim: wholeSim, normQR:a, normOCR:b};
    }

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio:false });
        video.srcObject = stream;
        await video.play();
        statusEl.textContent = '카메라 준비 완료';
        resizeCanvases();
        requestAnimationFrame(tick);
      } catch (err) {
        console.error(err);
        statusEl.textContent = '카메라 접근 실패: ' + (err.message || err);
      }
    }

    function resizeCanvases() {
      const w = video.videoWidth || video.clientWidth || 640;
      const h = video.videoHeight || video.clientHeight || 480;
      captureCanvas.width = w;
      captureCanvas.height = h;
      overlay.width = w;
      overlay.height = h;
    }

    window.addEventListener('resize', () => resizeCanvases());
    video.addEventListener('loadedmetadata', () => resizeCanvases());

    async function tick(ts) {
      if (video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
        captureCtx.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);
        const now = performance.now();
        if (now - lastQRTime >= QR_POLL_MS) {
          lastQRTime = now;
          try {
            const imgData = captureCtx.getImageData(0,0,captureCanvas.width, captureCanvas.height);
            const code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: "dontInvert" });
            overlayCtx.clearRect(0,0,overlay.width, overlay.height);
            if (code) {
              // Draw QR polygon
              drawPolygon(code.location);
              const qrText = code.data || '';
              qrTextEl.textContent = qrText || '[없음]';
              // If QR changed or enough time passed, run OCR on expanded region
              if ((qrText !== lastQRText) || (now - lastOCRTime >= OCR_COOLDOWN_MS)) {
                lastQRText = qrText;
                if (!isOCRRunning) {
                  triggerOCRForLocation(code.location, qrText);
                }
              }
            } else {
              qrTextEl.textContent = '[없음]';
              overlayCtx.clearRect(0,0,overlay.width, overlay.height);
            }
          } catch (e) {
            console.error('QR 처리 중 오류', e);
          }
        }
      }
      requestAnimationFrame(tick);
    }

    function drawPolygon(loc) {
      overlayCtx.strokeStyle = 'lime';
      overlayCtx.lineWidth = Math.max(2, overlay.width * 0.004);
      overlayCtx.beginPath();
      overlayCtx.moveTo(loc.topLeftCorner.x, loc.topLeftCorner.y);
      overlayCtx.lineTo(loc.topRightCorner.x, loc.topRightCorner.y);
      overlayCtx.lineTo(loc.bottomRightCorner.x, loc.bottomRightCorner.y);
      overlayCtx.lineTo(loc.bottomLeftCorner.x, loc.bottomLeftCorner.y);
      overlayCtx.closePath();
      overlayCtx.stroke();
      // small markers
      [loc.topLeftCorner, loc.topRightCorner, loc.bottomRightCorner, loc.bottomLeftCorner].forEach(pt=>{
        overlayCtx.fillStyle = 'yellow';
        overlayCtx.fillRect(pt.x-3, pt.y-3, 6,6);
      });
    }

    async function triggerOCRForLocation(loc, qrText) {
      isOCRRunning = true;
      statusEl.textContent = 'OCR 수행 중...';
      lastOCRTime = performance.now();
      try {
        // compute bounding rect from JSQR location points
        const xs = [loc.topLeftCorner.x, loc.topRightCorner.x, loc.bottomRightCorner.x, loc.bottomLeftCorner.x];
        const ys = [loc.topLeftCorner.y, loc.topRightCorner.y, loc.bottomRightCorner.y, loc.bottomLeftCorner.y];
        let minX = Math.max(0, Math.min(...xs)), maxX = Math.min(captureCanvas.width, Math.max(...xs));
        let minY = Math.max(0, Math.min(...ys)), maxY = Math.min(captureCanvas.height, Math.max(...ys));
        let w = maxX - minX, h = maxY - minY;
        // expand region
        const expand = QR_EXPAND_RATIO;
        const cx = minX + w/2, cy = minY + h/2;
        const newW = Math.min(captureCanvas.width, w * expand);
        const newH = Math.min(captureCanvas.height, h * expand);
        const sx = Math.max(0, Math.round(cx - newW/2));
        const sy = Math.max(0, Math.round(cy - newH/2));
        const sw = Math.min(captureCanvas.width - sx, Math.round(newW));
        const sh = Math.min(captureCanvas.height - sy, Math.round(newH));

        // crop to temporary canvas
        const crop = document.createElement('canvas');
        crop.width = sw; crop.height = sh;
        const cctx = crop.getContext('2d');
        cctx.drawImage(captureCanvas, sx, sy, sw, sh, 0, 0, sw, sh);

        // optional: draw the crop area on overlay
        overlayCtx.strokeStyle = 'cyan';
        overlayCtx.lineWidth = 2;
        overlayCtx.strokeRect(sx, sy, sw, sh);

        // perform OCR with Tesseract
        // using english model; adjust languages if needed
        const dataUrl = crop.toDataURL('image/png');
        // call Tesseract.recognize (v2 style)
        const res = await Tesseract.recognize(dataUrl, 'eng', { logger: m => {
          // console.log(m);
        } );
        const ocrText = (res && res.data && res.data.text) ? res.data.text : '';
        ocrTextEl.textContent = ocrText.trim() || '[없음]';

        // compare
        const cmp = isMatchNormalized(qrText, ocrText);
        matchEl.textContent = cmp.match ? 'YES' : 'NO';
        matchEl.style.color = cmp.match ? '#00FF88' : '#FF6666';
        statusEl.textContent = `유사도: ${(cmp.sim*100).toFixed(1)}%`;

        resultEl.textContent = `정규화 QR: ${cmp.normQR}\n정규화 OCR: ${cmp.normOCR}\n원문 QR: ${qrText}\n원문 OCR: ${ocrText.trim()}`;
      } catch (err) {
        console.error('OCR 실패', err);
        statusEl.textContent = 'OCR 실패: ' + (err.message || err);
      } finally {
        isOCRRunning = false;
      }
    }

    // Start
    initCamera();
  </script>
</body>
</html>
